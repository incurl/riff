# Fly.io application manifest for riff.
#
# This file is a *template*. Before deploying, set:
#
#   1. `app` to your chosen Fly app name (must be globally unique).
#   2. `primary_region` to the region closest to most users; riff
#      will boot from a fresh image in the region and read the
#      shared persistent volume. The default `iad` is US-East.
#   3. Secrets via `fly secrets set RIFF_INSTANCE_URL=...`.
#
# Reference: https://fly.io/docs/reference/configuration/

app = "riff"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  # Use the production Dockerfile under scripts/. Frontend assets
  # must already be present at server/frontend/dist (run
  # `cd web && pnpm release` before `fly deploy`). The
  # //go:embed in server/frontend/embed.go bakes the tree into
  # the riff binary during the Docker build, so no additional
  # COPY is needed for the SPA.
  dockerfile = "scripts/Dockerfile"

[env]
  # The image's PID 1 is supervisord; caddy and riff are its child
  # programs. Caddy binds 80/443 inside the container and
  # reverse-proxies /community/* to riff on the loopback 8090. The
  # Fly proxy's internal_port therefore points at 80 (caddy), not at
  # 8090 (riff). PocketBase's PB_PORT stays at the canonical
  # riff-internal 8090; the Fly proxy no longer needs to know it.
  # Note: riff reads PB_PORT, not Fly's bare PORT convention, so the
  # env-var name below is intentional.
  PB_PORT = "8090"
  # Enable the Connect request rate limiter; off in dev by default.
  RIFF_RATE_LIMIT = "1"
  # The default data dir. PocketBase will create the SQLite
  # database at /var/opt/riff/pb_data/data.db inside the
  # persistent volume.
  RIFF_DATA_DIR = "/var/opt/riff/pb_data"
  # Required for outbound webhooks, link previews, and email
  # notifications. The /community suffix matches caddy's path-based
  # routing and is the public path users will see in email links.
  # Set via `fly secrets set RIFF_INSTANCE_URL=...` for the real
  # hostname; the placeholder below is only for the local Fly proxy
  # until secrets are populated.
  RIFF_INSTANCE_URL = "http://localhost/community"
  # The site domain caddy issues a Let's Encrypt cert for. Must
  # match the DNS A/AAAA records pointing at this app. Set as a
  # `fly secrets set` in prod so the placeholder doesn't leak into
  # the issued cert.
  SITE_DOMAIN = "example.com"
  # Email caddy registers with Let's Encrypt when issuing the cert.
  # Same rationale as SITE_DOMAIN: real value via `fly secrets set`.
  ACME_EMAIL = "ops@example.com"

[experimental]
  # Required for [mounts] below; private volumes are not part of
  # the public Fly API yet.
  private_networking = true

[mounts]
  # Single shared persistent volume for PocketBase data and any
  # local-disk attachment cache. Mounted at the path the entrypoint
  # and the Dockerfile VOLUME agree on. Create the volume with
  # `fly volumes create riff_data --size 1` before first deploy.
  source = "riff_data"
  destination = "/var/opt/riff"

[[services]]
  # The image's PID 1 is supervisord; caddy binds 80/443 and proxies
  # /community/* to riff on the loopback 8090. The Fly proxy's
  # internal_port therefore points at 80 (caddy). caddy terminates
  # TLS itself, so the Fly proxy uses plain HTTP between proxy and
  # container (`handlers = ["http"]`, no force_https). The MCP
  # service, if enabled, is served at /community/mcp on the same
  # internal port (see main.go).
  internal_port = 80
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Fly already does TLS termination on the public side, and caddy
  # also does TLS on the inside. We disable force_https on the
  # proxy so the proxy does NOT 301 HTTP->HTTPS (which would loop
  # with caddy serving both); caddy itself can still issue a 301
  # if you want, via its redir directive in Caddyfile.
  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"

  [[services.http_checks]]
    # PocketBase exposes a simple /community/api/health that
    # returns 200 once the database is open and migrations have
    # applied. We use it for liveness; readiness uses the same
    # path because riff has no separate warm-up phase. caddy
    # transparently proxies the /community prefix, so the health
    # check URL is just the public path.
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/community/api/health"

[deploy]
  # The release_command runs once per deploy before the new
  # machine starts. We use it to print the resolved CalVer and
  # verify migrations would apply. The actual `version` and
  # `commit` are baked into the image at build time by
  # scripts/Dockerfile.
  release_command = "scripts/release_version.sh version \"$(git rev-parse --abbrev-ref HEAD)\" || true"

[metrics]
  # The metrics scraper hits the container directly, so it must
  # use caddy's public listener (port 80) and the /community
  # public path. Pointing it at 8090 would fail because 8090 is
  # loopback-only now that caddy is the public listener; using
  # /api/health would also fail because caddy only forwards the
  # /community/* prefix to riff.
  port = 80
  path = "/community/api/health"
