# Fly.io manifest for the riff deployment (`ravine`).
#
# The image is built LOCALLY and pushed to the Fly registry, because two of
# the build inputs cannot come from Fly's remote builder:
#
#   * the Vite SPA bundle in server/frontend/dist (`cd web && pnpm release`),
#     which scripts/Dockerfile bakes into the binary through `//go:embed`; and
#   * the Jekyll site imported as the buildkit named context `ravine`, whose
#     source tree lives outside this repository.
#
# Build and deploy (verified with flyctl v0.4.116):
#
#   cd web && pnpm release && cd ..
#   docker buildx build --platform linux/amd64 \
#     -f scripts/Dockerfile \
#     --build-context ravine="$(readlink -f scripts/ravine)" \
#     --build-arg VERSION="$(bash scripts/release_version.sh development-version)" \
#     --build-arg COMMIT="$(git rev-parse HEAD)" \
#     -t riff:dev --load .
#   flyctl auth docker                                    # log docker into registry.fly.io
#   docker tag riff:dev registry.fly.io/ravine:dev
#   docker push registry.fly.io/ravine:dev
#   flyctl deploy -a ravine
#
# `fly deploy` does NOT upload a local-only tag: --image is resolved in the
# Fly registry, so the image must be pushed there first (the `[build] image`
# below is that pushed reference). `--local-only` is not an option here
# because flyctl cannot pass a buildkit named context, and the Dockerfile
# needs `--build-context ravine=...`.
#
# The `dev` tag is mutable on purpose: every deploy overwrites it. The
# immutable identity of a running machine is the image digest plus the
# VERSION/COMMIT build args baked into the binary (`fly image show`, or
# `fly ssh console -C /usr/local/riff/riff version`).
#
# `readlink -f scripts/ravine` resolves the committed symlink to
# /home/peter/CLionProjects/ravine.1une.cc/website/_site on this machine; pass
# that absolute path directly if the symlink is missing locally.
#
# Container layout: supervisord is PID 1 and runs caddy (public, :80) and the
# riff PocketBase server (:8090, same container) as child programs. Caddy loads
# one of two edge-proxy variants (selected through the CADDYFILE env var below):
#
#   * /etc/caddy/Caddyfile.fly             — plain-HTTP, host-agnostic
#                                            reverse proxy that serves
#                                            the riff SPA at the ROOT of
#                                            the hostname (Vite emits
#                                            root-relative asset URLs and
#                                            the Connect client posts to
#                                            window.location.origin).
#   * /etc/caddy/Caddyfile.fly.community   — same plain-HTTP shape, but
#                                            the baked-in static site
#                                            serves at the root and
#                                            riff is mounted under
#                                            /community/. The SPA is
#                                            built with
#                                            VITE_BASE_PATH=/community/
#                                            so the prefix lines up.
#
# Neither variant terminates TLS; Fly's edge does, hence force_https below.

app = "ravine"
primary_region = "nrt"

# SIGTERM reaches supervisord, which forwards it to caddy and riff so both can
# drain in-flight requests. (Fly's default is SIGINT.)
kill_signal = "SIGTERM"
kill_timeout = "30s"

# 512MB of swap, so a transient memory spike under load doesn't OOM-kill
# the 256MB cgroup. See DECISIONS.md "Swap on 256MB Fly machine" for the
# why-not-container-side rationale.
#
# NOTE: this is a top-level key, NOT a field on `[[vm]]`. flyctl's
# `internal/appconfig/config.go` defines `SwapSizeMB *int` only on the
# top-level `Config` struct; the `Compute` struct that `[[vm]]` decodes
# to has no `swap_size_mb` tag. `fly deploy` does not run strict TOML
# validation by default, so a misplaced line is silently dropped during
# decoding and the machine boots with no swap. Keep it at this scope.
swap_size_mb = 512

[build]
  # The image, as pushed to Fly's registry by the commands above. `fly deploy`
  # resolves this reference on the Fly side (it does not read the local docker
  # daemon), so `docker push registry.fly.io/ravine:dev` must run first.
  image = "registry.fly.io/ravine:dev"

[deploy]
  # No release_command: Fly runs it on a throwaway machine that cannot see the
  # `riff_data` volume, and PocketBase already applies the migrations
  # registered from pb/migrations (migratecmd.Automigrate=true) during
  # bootstrap on every boot. A volume means one machine, so rolling is the
  # only deploy strategy available.
  strategy = "rolling"

[env]
  # riff binds 0.0.0.0:8090 when PB_PORT is set (main.go's OnServe hook).
  # Without it PocketBase listens on 127.0.0.1:8090, which caddy could still
  # reach, but the explicit value keeps `fly ssh console` debugging obvious.
  PB_PORT = "8090"
  # Which Caddyfile the caddy child loads. scripts/entrypoint-supervisord.sh
  # exports it before exec'ing supervisord. Two edge-proxy variants ship:
  #
  #   * Caddyfile.fly             riff SPA at the root, /community/* alias
  #                               (the previous layout)
  #   * Caddyfile.fly.community   static site at the root, riff at
  #                               /community/ (the layout this env var
  #                               selects)
  #
  # The caddy child is started with an explicit `--adapter caddyfile`
  # (scripts/supervisord.conf), which is what makes a non-`Caddyfile` file
  # name usable at all: caddy infers the adapter from the base name and
  # otherwise exits with "ambiguous config file format". The riff SPA
  # under /community/ is built with VITE_BASE_PATH=/community/ pnpm
  # release (see web/vite.config.mts) so its asset URLs and the
  # connect-web baseUrl line up with the prefix the caddy layer strips.
  CADDYFILE = "Caddyfile.fly.community"
  # Canonical public URL. It drives the MCP Origin allow-list and the links in
  # notification emails, and an empty value disables both features, so it must
  # match the hostname users actually see. Update it (and redeploy) after
  # attaching a custom domain with `fly certs add`.
  RIFF_INSTANCE_URL = "https://ravine.fly.dev"
  # RIFF_RATE_LIMIT is deliberately unset. The in-memory limiter keys on
  # PocketBase's RequestEvent.RealIP(), which falls back to the socket peer
  # when Settings.TrustedProxy is empty — behind caddy that is a single
  # address for every visitor, so the per-IP budgets would silently become
  # instance-wide budgets. To enable it safely:
  #   1. set RIFF_RATE_LIMIT = "1" here,
  #   2. open /_/ → Settings → Trusted proxy and list the X-Forwarded-For
  #      header (leftmost = true), since the Caddyfile forwards the real
  #      client in that header,
  #   3. redeploy.
  # RIFF_RATE_LIMIT = "1"

# Persistent riff data. Everything PocketBase writes resolves inside this
# mount: main.go pins the data dir to the relative "./pb_data", supervisord
# runs the riff child with directory=/var/opt/riff, and scripts/entrypoint.sh
# chowns the tree to UID 10001 before dropping privileges. Without the volume
# (or with the wrong cwd) pb_data and every uploaded patch/sample land on the
# machine's ephemeral filesystem and disappear on the next deploy.
[[mounts]]
  source = "riff_data"
  destination = "/var/opt/riff"

# caddy listens on :80 inside the machine and reverse-proxies to riff on
# 127.0.0.1:8090. Only that port is published: Fly's edge terminates TLS for
# the app's hostname and forwards here, and `force_https` redirects
# plain-HTTP visitors, so 443/Let's Encrypt belong to the edge, not to the
# container.
[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # One small SQLite-backed machine. Cap concurrent requests instead of
  # letting Fly queue an unbounded number of them behind a single writer.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 250
    hard_limit = 300

  # PocketBase's own health endpoint, reached through caddy. With
  # CADDYFILE=Caddyfile.fly.community, the riff listener is reverse-proxied
  # under /community/*; the prefix is stripped before forwarding, so
  # /community/api/health hits riff's 127.0.0.1:8090/api/health and returns
  # {"message":"API is healthy.","code":200,"data":{}}. The root /api/health
  # would be served by caddy's file_server against the static site (404) and
  # the check would mark every machine critical, which Fly's edge proxy
  # then propagates as a 503 to every region. (For CADDYFILE=Caddyfile.fly
  # the SPA is at the root and the check would be /api/health again.)
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/community/api/health"

# 1 shared CPU / 1 GB is the sizing the old manifest asked for and matches a
# single-machine PocketBase + SQLite instance. Bump `size` (not `memory`
# alone) if thumbnailing or transcription starts swapping.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
