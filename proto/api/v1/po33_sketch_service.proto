syntax = "proto3";

package memos.api.v1;

// -----------------------------------------------------------------------
// Connect-only surface — read this before editing annotations.
//
// The `option (google.api.http)` annotations in this file are
// OpenAPI-only today: they feed `proto/gen/openapi.yaml`, which the MCP
// service in `server/mcp/` reads at startup to build its tool catalog.
// There is **no** grpc-gateway mount in the riff binary, no
// `runtime.NewServeMux`, and no `RegisterXxxServiceHandlerServer` calls
// in the tree. See DECISIONS.md, top entry dated 2026-10-16.
//
// If/when a REST surface is added, the annotations MUST be re-based to
// a non-`/api/...` prefix (recommended: `/memos/api/v1/...`) so the
// gateway does not collide with PocketBase's `/api/...` namespace.
// -----------------------------------------------------------------------

import "api/v1/memo_service.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option go_package = "gen/api/v1";

// SketchService is the SPA-facing side of the
// PO-33 sketch upload flow. The lifecycle RPCs
// (PublishSketch, ArchiveSketch) live in this
// file. The device-side upload itself is a REST
// route (POST /api/po33/sketches/upload) in
// pb/api/po33_device_routes.go because the
// device runs an HTTP/1.1 client with a
// one-shot Ed25519 signature header rather
// than a Connect library. The previous
// ListSketchVersions / GetSketchVersion RPCs
// (an append-only `sketch_versions` audit log)
// were dropped on 2026-10-19 because the SPA
// never shipped a viewer for them; the device
// upload is the only authority on "which patch
// bytes live on disk" and the memo row's
// `sketch` JSON column already records the
// upload-time metadata.
service SketchService {
  // ListMySketches returns every memo the caller
  // authored with source=sketch. The response
  // includes the full Memo proto (with the
  // SketchPayload envelope populated) plus the
  // patches and samples as Attachment objects.
  // Pagination is by created-desc, max 100 per
  // page.
  rpc ListMySketches(ListMySketchesRequest) returns (ListMySketchesResponse) {
    option (google.api.http) = {get: "/api/v1/po33/sketches"};
  }

  // PublishSketch flips a sketch memo from DRAFT to
  // NORMAL. The caller must be the memo's author. A
  // memo that is not in DRAFT is rejected with
  // FAILED_PRECONDITION. After publish the memo
  // appears in the SPA feed and the public search
  // index. The HTTP annotation is the
  // google.api.method_signature "name" so the
  // google-api-rust / connect-web clients can
  // build a typed binding.
  rpc PublishSketch(PublishSketchRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*}:publish"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // ArchiveSketch flips a sketch memo from NORMAL
  // to ARCHIVED. The caller must be the memo's
  // author. The memo is removed from the SPA feed
  // and the public search index but the row and
  // its attachments are preserved on disk. A
  // re-publish is not possible; archive is one-way.
  // Re-uploads of the same sketch overwrite the
  // previous attachment blobs but do not change
  // the ARCHIVED state.
  rpc ArchiveSketch(ArchiveSketchRequest) returns (Memo) {
    option (google.api.http) = {
      post: "/api/v1/{name=memos/*}:archive"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

message ListMySketchesRequest {
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListMySketchesResponse {
  repeated Memo memos = 1;
  string next_page_token = 2;
}

message PublishSketchRequest {
  // The resource name of the memo to publish.
  // Format: memos/{memo}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Memo"}
  ];
}

message ArchiveSketchRequest {
  // The resource name of the memo to archive.
  // Format: memos/{memo}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Memo"}
  ];
}
