version: v2
inputs:
  - directory: .
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/incurl/riff/proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/community/google-gnostic-openapi
    out: gen
    opt: enum_type=string
  # TypeScript surface for web/src/types/proto/. Local plugin (not
  # a BSR remote) because protoc-gen-es v2.x is published to npm
  # and the existing 15 files under web/src/types/proto/ were
  # generated by v2.12.1. The BSR-distributed
  # buf.build/bufbuild/es plugin is the older v1.3.0 generator and
  # produces a different output style. Make sure `protoc-gen-es` is
  # on PATH (e.g. `cd web && pnpm install` first, or export
  # PATH="$PWD/web/node_modules/.bin:$PATH"); without that, buf
  # will fail with "protoc-gen-es: program not found".
  - local: protoc-gen-es
    out: ../web/src/types/proto
    opt: target=ts
