; supervisord configuration for the riff deploy image.
;
; Layout: one supervisord runs caddy and riff as two child programs,
; with supervisord as PID 1 so Docker's signal handling works.
;
; Both children log to /dev/stdout and /dev/stderr so `docker logs`
; interleaves caddy and riff output. We intentionally do NOT
; logrotate; the image is short-lived and the host collects logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; SIGTERM (from `docker stop`) should reach caddy so it can drain
; in-flight ACME renewals and shut its listener cleanly. Caddy
; handles SIGTERM natively; the child program entries below do not
; override this.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------- caddy ----------
;
; `caddy run` is the foreground form; it reads Caddyfile from the
; path given by --config. The --environ flag tells caddy to read
; env-var interpolation tokens ({$VAR}) at startup, which is what
; makes the SITE_DOMAIN / ACME_EMAIL defaults in scripts/Caddyfile
; work.
;
; --adapter caddyfile is load-bearing, not cosmetic. caddy picks the
; config adapter from the file name and only auto-detects a file whose
; base name is exactly `Caddyfile`; any other name (Caddyfile.fly
; included) makes `caddy run` abort at startup with "ambiguous config
; file format; please specify adapter (use --adapter)". Since
; autorestart=unexpected then retries, the container ends up in a
; BACKOFF loop with a healthy riff child but nothing listening on :80.
;
; The file name comes from CADDYFILE, which
; scripts/entrypoint-supervisord.sh always exports before exec'ing
; supervisord (`Caddyfile` — the ACME variant used by
; scripts/compose.yaml — by default, `Caddyfile.fly` when an edge
; proxy such as Fly.io terminates TLS instead; see fly.toml), so the
; %(ENV_CADDYFILE)s expansion below can never see an unset variable.
[program:caddy]
command=/usr/sbin/caddy run --environ --config /etc/caddy/%(ENV_CADDYFILE)s --adapter caddyfile
directory=/
autostart=true
autorestart=unexpected
startsecs=5
startretries=10
; caddy needs to bind 80 and 443, which requires CAP_NET_BIND_SERVICE.
; The image adds that capability in the Dockerfile; supervisord
; inherits the bound caps from PID 1.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

; ---------- riff ----------
;
; The existing entrypoint.sh handles the UID 0 -> nonroot drop and
; the RIFF_*_FILE env-var loading. We invoke it as the program so
; the same privilege-drop semantics apply under supervisord as
; under a direct `docker run` of the previous image.
[program:riff]
; `serve` is mandatory. PocketBase's cobra root command carries no Run handler,
; so a bare `/usr/local/riff/riff` prints the help text and exits 0 — the
; process never listens, and `autorestart=unexpected` would not even notice,
; leaving caddy proxying to a closed port. entrypoint.sh passes its arguments
; through to the binary after the privilege drop, and the listen address comes
; from PB_PORT (0.0.0.0:8090; see main.go's OnServe hook).
command=/usr/local/riff/entrypoint.sh /usr/local/riff/riff serve
; The child's cwd decides where PocketBase stores its data: main.go pins
; it to the relative DataDir "./pb_data", so the process must start in
; the directory the persistent volume is mounted on (/var/opt/riff, the
; same tree scripts/entrypoint.sh chowns to the nonroot UID). Running
; from "/" would put pb_data — every memo, every uploaded patch and
; sample — on the container's ephemeral filesystem, where it is lost on
; the next deploy.
directory=/var/opt/riff
autostart=true
autorestart=unexpected
startsecs=2
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[group:riff-deploy]
programs=caddy,riff
priority=10
