services:
  riff:
    image: incurl/riff:stable
    container_name: riff
    # Bind the host's riff data dir to /var/opt/riff inside the
    # container. The container writes pb_data/, attachments, and
    # any S3-cached files under here, so it must be persistent.
    volumes:
      - ~/.riff/:/var/opt/riff
    # caddy binds 80 and 443 inside the container and reverse-proxies
    # /community/* to riff on the loopback 8090. 8090 is NOT
    # published; only caddy's two ports are reachable from the host.
    ports:
      - "80:80"
      - "443:443"
    # caddy needs CAP_NET_BIND_SERVICE to bind 80/443. Everything else
    # is dropped so a compromised caddy or riff child cannot escalate.
    # (The supervisord entrypoint still runs as root to fork caddy;
    # caddy drops to its own user internally, and the riff program
    # uses the existing entrypoint.sh UID 0 -> nonroot drop.)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # SITE_DOMAIN tells caddy which host to issue a Let's Encrypt cert
    # for. ACME_EMAIL is the contact for the registration. For local
    # dev with SITE_DOMAIN=localhost, caddy skips ACME and serves plain
    # HTTP on 80.
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-example.com}
      - ACME_EMAIL=${ACME_EMAIL:-ops@example.com}
      - RIFF_INSTANCE_URL=${RIFF_INSTANCE_URL:-https://example.com/community}
      # RIFF_FTS=1 serves memo content search from the SQLite FTS5
      # index instead of a LIKE scan.
      #
      # The index itself is ALWAYS built — migration
      # 1910000000_create_memos_fts creates memos_fts and its triggers
      # unconditionally — so the flag only decides whether the index is
      # *queried*. With it off you pay the write cost of maintaining the
      # index and get none of the query benefit.
      #
      # The behaviour difference: FTS folds case across the whole Unicode
      # range and strips diacritics, so "cafe" finds "café" and "блины"
      # finds "Блины". A LIKE scan folds ASCII only, so those searches
      # returned nothing. FTS matches whole tokens rather than
      # substrings, so "カフェ" does not match "カフェで" (use
      # "カフェ*"). Negated searches (`!content.contains(...)`) and
      # startsWith/endsWith keep using LIKE and are unaffected.
      #
      # This defaults to 0 here, while the image's entrypoint defaults
      # it to 1: compose passes the value explicitly, so the entrypoint
      # default only applies to a bare `docker run` and to the Fly
      # deploy (which has no compose file). Set it to 1 here to match.
      #
      # Read once at process start (os.Getenv), so changing it needs a
      # container restart, never a rebuild.
      - RIFF_FTS=${RIFF_FTS:-0}
    # Optional: pass the canonical instance URL for email
    # notification links, MCP origin allow-list, and webhook
    # callbacks. If unset, links fall back to relative paths.
    # environment:
    #   - RIFF_INSTANCE_URL=https://riff.example.com/community
    # Optional: enable the FTS5-backed content search.
    # environment:
    #   - RIFF_FTS=1
